<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
  <title id="t">Architecture of tliligis.me</title>
  <desc id="d">Visitor browser and admin panel call a Cloudflare Worker, which reads a D1 database and three R2 buckets: derived GeoJSON, Potree octrees streamed with range requests, and private originals.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#586579"/>
    </marker>
    <style>
      text { font-family: Poppins, "Segoe UI", system-ui, sans-serif; fill: #142033; }
      .h { font-size: 14px; font-weight: 600; }
      .s { font-size: 11px; fill: #586579; }
      .l { font-size: 10.5px; fill: #586579; }
      .box { fill: #FFFFFF; stroke: #DCE2EA; stroke-width: 1.2; }
      .edge { fill: none; stroke: #586579; stroke-width: 1.3; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="960" height="440" fill="#F7F8FA"/>

  <!-- clients -->
  <rect class="box" x="24" y="52" width="216" height="118" rx="10"/>
  <rect x="24" y="52" width="216" height="6" rx="3" fill="#1769D1"/>
  <text class="h" x="40" y="86">Visitor browser</text>
  <text class="s" x="40" y="108">index.html · vanilla JS</text>
  <text class="s" x="40" y="126">Leaflet 2D map (canvas)</text>
  <text class="s" x="40" y="144">Potree 3D viewer (iframe)</text>
  <text class="s" x="40" y="162">no cookies · no 3rd-party scripts</text>

  <rect class="box" x="24" y="268" width="216" height="96" rx="10"/>
  <rect x="24" y="268" width="216" height="6" rx="3" fill="#F0B429"/>
  <text class="h" x="40" y="302">Admin panel  /admin</text>
  <text class="s" x="40" y="324">projects · layers · point clouds</text>
  <text class="s" x="40" y="342">lead inbox · analytics · uploads</text>
  <text class="s" x="40" y="358">X-Admin-Token secret</text>

  <!-- worker -->
  <rect class="box" x="352" y="118" width="256" height="200" rx="10"/>
  <rect x="352" y="118" width="256" height="6" rx="3" fill="#1769D1"/>
  <text class="h" x="368" y="152">Cloudflare Worker</text>
  <text class="s" x="368" y="172">worker/index.js · worker/admin.js</text>
  <text class="s" x="368" y="198">/api/manifest · /api/layer-data/:id</text>
  <text class="s" x="368" y="216">/api/pointclouds · /clouds/* (HTTP 206)</text>
  <text class="s" x="368" y="234">/api/leads · /api/events</text>
  <text class="s" x="368" y="252">/api/admin/* · multipart uploads</text>
  <text class="s" x="368" y="278">static assets · HTML always revalidated</text>
  <text class="s" x="368" y="296">rate limit on hashed IP · CORS on reads only</text>

  <!-- storage -->
  <rect class="box" x="720" y="36" width="216" height="84" rx="10"/>
  <rect x="720" y="36" width="216" height="6" rx="3" fill="#2F8F6B"/>
  <text class="h" x="736" y="68">D1 · gis-db (SQLite)</text>
  <text class="s" x="736" y="88">projects · layers · pointclouds</text>
  <text class="s" x="736" y="106">leads · events · upload_log</text>

  <rect class="box" x="720" y="140" width="216" height="66" rx="10"/>
  <rect x="720" y="140" width="216" height="6" rx="3" fill="#586579"/>
  <text class="h" x="736" y="172">R2 · repo</text>
  <text class="s" x="736" y="192">derived public GeoJSON</text>

  <rect class="box" x="720" y="226" width="216" height="66" rx="10"/>
  <rect x="720" y="226" width="216" height="6" rx="3" fill="#586579"/>
  <text class="h" x="736" y="258">R2 · clouds-public</text>
  <text class="s" x="736" y="278">Potree octrees · range requests</text>

  <rect class="box" x="720" y="312" width="216" height="66" rx="10"/>
  <rect x="720" y="312" width="216" height="6" rx="3" fill="#586579"/>
  <text class="h" x="736" y="344">R2 · gis-private</text>
  <text class="s" x="736" y="364">untouched originals · never served</text>

  <!-- edges -->
  <path class="edge" d="M240,96 C300,96 300,168 352,168"/>
  <text class="l" x="252" y="86">GET manifest · layers</text>
  <path class="edge" d="M240,140 C300,140 300,214 352,214"/>
  <text class="l" x="252" y="131">GET /clouds/… Range</text>
  <path class="edge" d="M240,316 C300,316 300,262 352,262"/>
  <text class="l" x="252" y="342">POST /api/admin/*</text>

  <path class="edge" d="M608,168 C660,168 660,78 720,78"/>
  <text class="l" x="630" y="112">SQL</text>
  <path class="edge" d="M608,196 C660,196 660,173 720,173"/>
  <path class="edge" d="M608,224 C660,224 660,259 720,259"/>
  <path class="edge" d="M608,262 C660,262 660,345 720,345"/>
  <text class="l" x="626" y="322">writes only</text>

  <!-- footer -->
  <text class="l" x="24" y="412">Deploy: git push → Cloudflare Workers Builds → wrangler deploy · no build step · custom domain tliligis.me</text>
  <text class="l" x="24" y="428">Data flow: originals → private bucket · derived copy → public bucket · catalog → D1 · viewer streams only what is in view</text>
</svg>
