<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiDAR 3D Viewer — Tlili Mohamed</title>
<meta name="description" content="Interactive 3D point cloud viewer — LiDAR survey data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./libs/potree/potree.css">
<style>
  :root{
    --bg:#0e1420; --panel:rgba(13,20,32,.92); --line:rgba(255,255,255,.09);
    --text:#e8edf5; --muted:#8b98ad; --accent:#4da8da; --accent2:#f0b429;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'Poppins','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}

  /* ---------- header ---------- */
  .topbar{position:fixed;inset:0 0 auto 0;height:58px;z-index:50;display:flex;align-items:center;gap:14px;
    padding:0 18px;background:var(--panel);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .brand{font-weight:700;font-size:15px;letter-spacing:.2px;color:var(--text);text-decoration:none;white-space:nowrap}
  .brand span{color:var(--accent)}
  .topbar .sep{width:1px;height:24px;background:var(--line)}
  .page-title{font-size:13px;color:var(--muted);white-space:nowrap}
  .cloud-tabs{display:flex;gap:8px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
  .cloud-tabs::-webkit-scrollbar{display:none}
  .cloud-tab{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);
    font:inherit;font-size:12px;font-weight:500;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;
    transition:all .18s ease}
  .cloud-tab:hover{color:var(--text);border-color:var(--accent)}
  .cloud-tab.active{background:var(--accent);border-color:var(--accent);color:#06121d;font-weight:600}
  .srs-badge{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--accent2);
    border:1px solid rgba(240,180,41,.35);background:rgba(240,180,41,.08);padding:6px 12px;border-radius:999px;white-space:nowrap}
  .srs-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--accent2)}

  /* ---------- viewer ---------- */
  #stage{position:fixed;inset:58px 0 0 0}
  #potree_render_area{position:absolute;inset:0;width:100%;height:100%}
  canvas{display:block}

  /* ---------- info card ---------- */
  .info-card{position:fixed;left:16px;bottom:16px;z-index:40;width:min(330px,calc(100vw - 32px));
    background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
    box-shadow:0 12px 40px rgba(0,0,0,.45)}
  .info-card h2{font-size:14px;font-weight:600;margin-bottom:2px}
  .info-card .cat{font-size:11.5px;color:var(--accent);margin-bottom:10px;font-weight:500}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:12px;padding:4.5px 0;border-top:1px dashed rgba(255,255,255,.07)}
  .kv .k{color:var(--muted)}
  .kv .v{font-variant-numeric:tabular-nums;text-align:right}
  .hint{margin-top:10px;font-size:11px;color:var(--muted);line-height:1.5}

  /* ---------- overlay states ---------- */
  .overlay{position:fixed;inset:58px 0 0 0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;background:radial-gradient(1200px 700px at 50% 30%,#182236 0%,var(--bg) 70%);text-align:center;padding:20px}
  .overlay.hidden{display:none}
  .spinner{width:42px;height:42px;border-radius:50%;border:3px solid rgba(77,168,218,.18);border-top-color:var(--accent);
    animation:spin 0.9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .overlay .msg{font-size:14px;color:var(--muted);max-width:460px;line-height:1.65}
  .overlay .err-icon{font-size:34px;line-height:1}
  .overlay .msg b{color:var(--text)}
  .overlay a.btn{display:inline-block;margin-top:6px;padding:9px 18px;border-radius:10px;background:var(--accent);
    color:#06121d;font-weight:600;font-size:13px;text-decoration:none}

  @media (max-width:640px){
    .page-title,.srs-badge{display:none}
    .info-card{left:10px;bottom:10px;right:10px;width:auto;padding:12px 14px}
    .kv{font-size:11px}
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="/">Tlili<span>Mohamed</span></a>
  <div class="sep"></div>
  <div class="page-title">LiDAR &mdash; 3D Point Cloud Viewer</div>
  <nav class="cloud-tabs" id="cloudTabs" aria-label="Point clouds"></nav>
  <div class="srs-badge" id="srsBadge"><span class="dot"></span><span id="srsLabel">EPSG:2056 &middot; CH1903+/LV95</span></div>
</header>

<div id="stage">
  <div class="potree_container" style="position:absolute;inset:0;">
    <div id="potree_render_area"></div>
  </div>
</div>

<aside class="info-card" id="infoCard" hidden>
  <h2 id="iTitle">&mdash;</h2>
  <div class="cat" id="iStatus">&mdash;</div>
  <div class="kv"><span class="k">Points</span><span class="v" id="iPoints">&mdash;</span></div>
  <div class="kv"><span class="k">E (min / max)</span><span class="v" id="iE">&mdash;</span></div>
  <div class="kv"><span class="k">N (min / max)</span><span class="v" id="iN">&mdash;</span></div>
  <div class="kv"><span class="k">Z (min / max)</span><span class="v" id="iZ">&mdash;</span></div>
  <div class="kv"><span class="k">Center (WGS84)</span><span class="v" id="iWGS">&mdash;</span></div>
  <div class="hint">Drag: orbit &nbsp;&middot;&nbsp; Right-drag: pan &nbsp;&middot;&nbsp; Scroll: zoom<br>Coordinates shown in CH1903+/LV95 (EPSG:2056).</div>
</aside>

<div class="overlay" id="overlay">
  <div class="spinner" id="ovSpinner"></div>
  <div class="msg" id="ovMsg">Loading point cloud catalog&hellip;</div>
</div>

<script src="./libs/jquery/jquery-3.1.1.min.js"></script>
<script src="./libs/three/three.min.js"></script>
<script src="./libs/tween/tween.min.js"></script>
<script src="./libs/other/BinaryHeap.js"></script>
<script src="./libs/proj4/proj4.js"></script>
<script src="./libs/potree/potree.js"></script>
<script>
(function () {
  "use strict";

  // ---- EPSG:2056 (CH1903+/LV95) definition for WGS84 readout -------------
  proj4.defs("EPSG:2056",
    "+proj=somerc +lat_0=46.9524055555556 +lon_0=7.43958333333333 +k_0=1 " +
    "+x_0=2600000 +y_0=1200000 +ellps=bessel +towgs84=674.374,15.056,405.346 " +
    "+units=m +no_defs");

  const overlay = document.getElementById("overlay");
  const ovSpinner = document.getElementById("ovSpinner");
  const ovMsg = document.getElementById("ovMsg");
  const tabsEl = document.getElementById("cloudTabs");
  const infoCard = document.getElementById("infoCard");

  function fmt(n, d) {
    return Number(n).toLocaleString("en-US", { maximumFractionDigits: d === undefined ? 1 : d });
  }
  function showOverlay(spinner, html) {
    overlay.classList.remove("hidden");
    ovSpinner.style.display = spinner ? "block" : "none";
    ovMsg.innerHTML = html;
  }
  function hideOverlay() { overlay.classList.add("hidden"); }

  // ---- Potree viewer bootstrap -------------------------------------------
  const viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
  viewer.setFOV(60);
  viewer.setPointBudget(1500000);
  viewer.setEDLEnabled(false);   // RGB clouds read better without EDL
  viewer.setBackground("gradient");
  viewer.loadSettingsFromURL();

  let activeSlug = null;
  let activeMeta = null;

  async function fetchJSON(url) {
    const r = await fetch(url, { headers: { "accept": "application/json" } });
    if (!r.ok) throw Object.assign(new Error("HTTP " + r.status), { status: r.status });
    return r.json();
  }

  function describe(meta) {
    const bb = meta.boundingBox || {};
    const mn = bb.min || [0, 0, 0], mx = bb.max || [0, 0, 0];
    document.getElementById("iPoints").textContent = fmt(meta.points || 0, 0);
    document.getElementById("iE").textContent = fmt(mn[0]) + " / " + fmt(mx[0]);
    document.getElementById("iN").textContent = fmt(mn[1]) + " / " + fmt(mx[1]);
    document.getElementById("iZ").textContent = fmt(mn[2]) + " / " + fmt(mx[2]);
    const c = [(mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2];
    try {
      const ll = proj4("EPSG:2056", "WGS84", c);
      document.getElementById("iWGS").textContent = ll[1].toFixed(4) + "\u00B0N, " + ll[0].toFixed(4) + "\u00B0E";
    } catch (e) {
      document.getElementById("iWGS").textContent = "\u2014";
    }
  }

  async function loadCloud(entry) {
    if (entry.slug === activeSlug) return;
    activeSlug = entry.slug;
    tabsEl.querySelectorAll(".cloud-tab").forEach(b =>
      b.classList.toggle("active", b.dataset.slug === entry.slug));
    infoCard.hidden = false;
    document.getElementById("iTitle").textContent = entry.title_en || entry.slug;
    document.getElementById("iStatus").textContent = "Loading octree\u2026";

    showOverlay(true, "Streaming <b>" + (entry.title_en || entry.slug) + "</b> point cloud&hellip;<br>" +
      "<span style='font-size:12px'>First load downloads the full octree once &mdash; then it is cached.</span>");

    try {
      const base = "/clouds/" + entry.prefix;                    // e.g. /clouds/las-1/
      activeMeta = await fetchJSON(base + "metadata.json");

      // remove previous clouds (single-page multi-cloud switch)
      viewer.scene.pointclouds.slice().forEach(pc => viewer.scene.removePointCloud(pc.name));

      const e = await Potree.loadPointCloud(base + "metadata.json", entry.slug);
      const pc = e.pointcloud;
      pc.material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
      pc.material.size = 0.7;
      pc.material.minSize = 1.5;

      // Pick the best available color attribute.
      // LiDAR LAS files often carry NO RGB at all — forcing "rgba" there
      // renders every point black. Fall back: RGB -> intensity -> classification.
      const names = (activeMeta.attributes || []).map(a => a.name);
      const hasRGB = names.indexOf("rgb") !== -1 || names.indexOf("rgba") !== -1;
      const hasInt = names.indexOf("intensity") !== -1;
      const hasCls = names.indexOf("classification") !== -1;
      pc.material.activeAttributeName =
        hasRGB ? "rgba" : hasInt ? "intensity" : hasCls ? "classification" : "intensity";

      // Potree 1.8.2 ships intensityRange = [Infinity, -Infinity], which makes
      // the intensity shader output NaN (black). Seed it from the metadata
      // ranges recorded by PotreeConverter, plus a mild gamma lift.
      if (!hasRGB && hasInt) {
        const ia = (activeMeta.attributes || []).find(a => a.name === "intensity") || {};
        const lo = Array.isArray(ia.min) ? ia.min[0] : (ia.min !== undefined ? ia.min : 0);
        const hi = Array.isArray(ia.max) ? ia.max[0] : (ia.max !== undefined ? ia.max : 65535);
        if (isFinite(lo) && isFinite(hi) && hi > lo) pc.material.intensityRange = [lo, hi];
        pc.material.intensityGamma = 0.85;
      }

      viewer.scene.addPointCloud(pc);
      viewer.fitToScreen();

      describe(activeMeta);
      document.getElementById("iStatus").textContent =
        (entry.status || "ready") + " \u00B7 source CRS: " +
        (activeMeta.projection || entry.srs || "EPSG:2056 (assumed)");
      hideOverlay();
    } catch (err) {
      const s = err && err.status;
      if (s === 404) {
        showOverlay(false,
          "<div class='err-icon'>&#9723;</div><b>Octree not uploaded yet</b><br>" +
          "The catalog entry exists, but the converted point cloud files are not in storage.<br>" +
          "<span style='font-size:12px'>Upload the PotreeConverter output to the <b>clouds-public</b> bucket (prefix " +
          "<code>" + (entry.prefix || "?") + "</code>), then reload this page.</span>" +
          "<a class='btn' href='/'>Back to portfolio</a>");
      } else {
        showOverlay(false,
          "<div class='err-icon'>&#9888;</div><b>Could not load the point cloud</b><br>" +
          String(err && err.message || err) +
          "<span style='font-size:12px;display:block;margin-top:6px'>If you just uploaded it, wait a few seconds and reload.</span>" +
          "<a class='btn' href='/'>Back to portfolio</a>");
      }
      document.getElementById("iStatus").textContent = "unavailable";
    }
  }

  // ---- catalog ------------------------------------------------------------
  (async function init() {
    try {
      const data = await fetchJSON("/api/pointclouds");
      const clouds = (data && data.pointclouds) || [];
      if (!clouds.length) {
        showOverlay(false, "<div class='err-icon'>&#9723;</div><b>No point clouds published yet</b><br>" +
          "This page will list every published dataset from the catalog.");
        return;
      }
      clouds.forEach((entry, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "cloud-tab" + (i === 0 ? " active" : "");
        b.dataset.slug = entry.slug;
        b.textContent = entry.title_en || entry.slug;
        b.addEventListener("click", () => loadCloud(entry));
        tabsEl.appendChild(b);
      });
      if (clouds.length === 1) tabsEl.style.display = "none";
      await loadCloud(clouds[0]);
    } catch (err) {
      showOverlay(false, "<div class='err-icon'>&#9888;</div><b>Catalog unavailable</b><br>" +
        String(err && err.message || err) +
        "<span style='font-size:12px;display:block;margin-top:6px'>The API did not answer &mdash; check the deployment, or reload.</span>" +
        "<a class='btn' href='/'>Back to portfolio</a>");
    }
  })();
})();
</script>
</body>
</html>
